name: macOS CI and release

on:
  push:
    branches: [main, test, develope]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New release tag, e.g. v2.0.0-macos (empty = build only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Check version and tag
        id: metadata
        run: node scripts/macos-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Refuse to replace an existing release
        if: steps.metadata.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" existing-tags.txt; then
            echo "::error::Release $RELEASE_TAG already exists. Choose a new tag."
            exit 1
          fi

  build:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build DMG and ZIP
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never
      - name: Verify archives and launch packaged Axon
        run: node tests/mac-packaged.mjs
        env:
          AXON_MAC_ARCH: ${{ matrix.arch }}
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-evidence-${{ matrix.arch }}
          path: |
            artifacts/mac-*.json
            artifacts/mac-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Save distributables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish macOS downloads
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: macos-release-*
          path: release
          merge-multiple: true
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            for ext in dmg zip; do
              test -s "release/Axon-$RELEASE_VERSION-mac-$arch.$ext"
            done
          done
          (cd release && sha256sum -- *.dmg *.zip > SHA256SUMS.txt)
          cp docs/releases/macos.md release-notes.md
          printf '\nVersion: %s\nCommit: %s\nBuild: %s/%s/actions/runs/%s\n' \
            "$RELEASE_VERSION" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "Axon $RELEASE_VERSION — macOS" --notes-file release-notes.md \
            --prerelease --draft
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false
